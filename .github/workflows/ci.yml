name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The e2e suite's Chrome for Testing isn't needed in CI.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run format:check
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Check translations match English
        run: npm run locales
      - uses: actions/upload-artifact@v7
        with:
          name: pushpilot
          path: |
            dist/*-chrome.zip
            dist/*-firefox.zip
