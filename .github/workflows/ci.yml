name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The e2e suite's Chrome for Testing isn't needed in CI.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run format:check
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: pushpilot-chrome
          path: dist/*-chrome.zip
