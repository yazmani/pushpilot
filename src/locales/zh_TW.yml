  title: Pushpilot $1 新功能
  seeAll: 查看所有變更
  label: 新功能
  v1_6:
    browsers: 'Pushpilot 現在也能在 Firefox 使用，並已上架 Microsoft Edge 附加元件商店。到哪裡都是同一個帳戶、同一份紀錄。'
  v1_5:
    fullPage: '點按頭像旁的 ⤢ 按鈕，以完整頁面開啟 Pushpilot：概覽、附大型預覽的動態，簡訊並排顯示。'
