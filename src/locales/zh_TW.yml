  v1_4:
    jump: '在動態或相簿中跳到任一月份：點按日期標題即可。'
    numbers: '簡訊中的電話號碼會依手機上的格式顯示。'
  v1_3:
    history: '在動態中查看完整推送記錄，圖片以相簿呈現，檔案依類型分類。'
    codes: '簡訊中的登入驗證碼會附上複製按鈕。'
    outbox: '離線時傳送的推送會排隊等候，恢復連線後自動送出。可一次選取多則推送並一併清除。'
    phones: '手機悄悄停止接收推送時會提醒你；另新增「複製診斷資訊」，方便回報問題。'
  v1_2:
    languages: 'Pushpilot 現已支援 17 種語言，並依瀏覽器的語言顯示。'
  v1_1:
    pushAnywhere: 在任何應用程式中推送：複製內容後按下 ⌘⇧9（Ctrl+Shift+9）即可。
    filesOpen: 圖片、PDF 和其他檔案送達後會在新分頁中開啟。
    shortcut: iPhone、iPad 和 Mac：使用 Pushpilot 捷徑，從分享表單推送。
    polish: 淺色主題、更寬敞的彈出式視窗，以及接收方面的修正。
